name: Build and verify Python wheel
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - run: python -m pip install dist/*.whl
      - run: |
          hanoi 3
          python - <<'PY'
          from hanoi_visualizer import solve
          for disks in range(1, 11):
              moves = solve(disks)
              assert len(moves) == 2**disks - 1
              towers = [list(range(disks, 0, -1)), [], []]
              for source, target in moves:
                  disk = towers[source].pop()
                  assert not towers[target] or towers[target][-1] > disk
                  towers[target].append(disk)
              assert towers == [[], [], list(range(disks, 0, -1))]
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: hanoi-visualizer-wheel
          path: dist/*.whl
